[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "framework-mvp"
version = "0.1.0.dev0"
description = "Softwaretechnische Instanziierung eines Frameworks zur datengetriebenen Ableitung konzeptioneller Modelle."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Georg Bommer" }
]
dependencies = [
    "pandas>=3.0,<4.0",
    "streamlit>=1.59,<2.0",
    "openpyxl>=3.1,<4.0",
    "pm4py>=2.7,<3.0",
    "jinja2>=3.1,<4.0",
    "weasyprint>=69.0,<70.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.15,<1.0",
    "pyright>=1.1,<2.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pyright]
include = [
    "src",
    "tests",
    "streamlit_app.py",
]
exclude = [
    ".venv",
    "workspace",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
